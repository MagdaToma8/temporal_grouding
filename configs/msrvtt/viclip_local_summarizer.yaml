pooler_config:
    embed_dim: 768
    num_heads: 12
    mlp_ratio: 4.0
    depth: 2
global_embeddings_vision: False
global_embeddings_text: False
text_dim: 512
vision_dim: 768

learning_rate: 0.0003
weight_decay: 0.01

# --debug runs: batch_size=1 -> 2.45GB reserved, ~2.5s/video; batch_size=8 -> 14.03GB
# reserved, ~1.9s/video (on a 48GB L40) -- batching gives some per-video speedup but a
# real 8,500-video epoch at bs=8 is still ~4.4 hours, and this config's 30-epoch budget
# (matching viclip_global_summarizer.yaml, which never triggered early stopping even at
# that epoch count) would take multiple days. Training is split across several SLURM
# job submissions via --run_name/--resume_checkpoint (see job_train_afs_local_viclip.slurm)
# rather than cutting max_epochs short, to stay comparable to the global-mode run. Raised
# to 16 for one more speedup try -- extrapolating the bs=1->8 memory growth linearly
# (~1.65GB/example, ~0.8GB fixed) estimates ~27GB, safely under budget. Verify with one
# more --debug run before committing to the full (multi-job) run.
batch_size: 16
max_epochs: 30
