pooler_config:
    embed_dim: 768
    num_heads: 12
    mlp_ratio: 4.0
    depth: 2
global_embeddings_vision: False
global_embeddings_text: False
text_dim: 512
vision_dim: 768

learning_rate: 0.0003
weight_decay: 0.01

# Conservative starting point, not yet tuned: each retrieved video is 1569 vision tokens
# (1 class token + 196 patches x 8 frames) vs. a single CLIP-B/32 image's ~50 in the
# image-domain local configs (configs/flickr30k/clip_local_summarizer.yaml uses batch_size
# 512 at that scale) -- with top_k_feedback=5 retrieved videos plus the query video per
# example, local-mode AFS here attends over roughly 9,400 vision tokens per training
# example, ~30x more than any local-mode config tried so far in this project. Verify with
# --debug first and raise this once real GPU memory usage is known.
batch_size: 1
max_epochs: 30
