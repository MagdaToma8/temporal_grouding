pooler_config:
    embed_dim: 768
    num_heads: 12
    mlp_ratio: 4.0
    depth: 2
global_embeddings_vision: False
global_embeddings_text: False
text_dim: 512
vision_dim: 768

learning_rate: 0.0003
weight_decay: 0.01

# A --debug run at batch_size=1 (each training example already attends over ~9,400
# vision tokens -- see git history for the original sizing note) measured only 2.45GB
# peak GPU memory reserved on a 48GB L40 -- but at batch_size=1, a real epoch would be
# 8,500 steps and, per that same debug run's step timing, take on the order of 7 hours
# each. Raised to 8 (matching viclip_global_summarizer.yaml) since memory scales ~linearly
# with batch size here (per-example sequence length is fixed) -- estimated ~20GB, well
# within budget. Verify with one more --debug run before committing to a full job.
batch_size: 8
max_epochs: 30
